<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Olfa cert-chain-3d demo</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #111; color: #eee; }
    .demo { max-width: 900px; margin: 2rem auto; padding: 1rem; }
    .card { background: #222; border: 1px solid #444; border-radius: 8px; padding: 1rem; margin: 1rem 0; }
    canvas { width: 100%; height: 400px; display: block; }
    #status { margin: 1rem 0; color: #aaa; }
    input { padding: 0.5rem; font-size: 1rem; width: 100%; max-width: 300px; }
  </style>
</head>
<body>
  <div class="demo">
    <h2>Olfa cert-chain-3d</h2>
    <p>Enter a hostname to fetch its TLS certificate chain and visualise the health colour.</p>

    <div class="card">
      <label>Hostname</label>
      <input id="hostInput" placeholder="example.com">
      <button id="fetchBtn">Fetch chain</button>
    </div>

    <div id="status"></div>
    <canvas id="chainCanvas"></canvas>
  </div>

  <script type="module">
    import { fetchChain } from './chain.js';

    const hostInput = document.getElementById('hostInput');
    const fetchBtn = document.getElementById('fetchBtn');
    const statusDiv = document.getElementById('status');
    const canvas = document.getElementById('chainCanvas');
    const ctx = canvas.getContext('2d');

    let drawChain = () => {
      // Simple 2D fallback: just show the color.
      const data = window.chainData;
      if (!data || !data.ok) {
        ctx.fillStyle = '#aaaaaa';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#fff';
        ctx.font = '16px system-ui';
        ctx.fillText('No chain data', 20, 100);
        return;
      }

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = data.color;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#fff';
      ctx.font = '14px system-ui';
      ctx.fillText(`Host: ${data.host}`, 10, 30);
      ctx.fillText(`Level: ${data.level}`, 10, 55);
      ctx.fillText(`Reasons: ${data.reasons.join(', ')}`, 10, 80);
    };

    fetchBtn.addEventListener('click', async () => {
      const host = hostInput.value.trim() || 'example.com';
      statusDiv.textContent = `Fetching chain for ${host}…`;
      const result = await fetchChain(host);
      window.chainData = result;
      statusDiv.textContent = `Level: ${result.level} (${result.reasons.join('; ')})`;
      drawChain();
    });

    // Initial state
    drawChain();
  </script>
</body>
</html>

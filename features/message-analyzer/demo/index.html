<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Olfa message analyzer demo</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #fafafa; color: #111; }
    .demo { max-width: 800px; margin: 2rem auto; padding: 1rem; }
    .card { border: 1px solid #ddd; border-radius: 8px; padding: 1rem; margin: 1rem 0; background: #fff; }
    textarea { width: 100%; height: 120px; font-family: inherit; font-size: 1rem; padding: 0.5rem; }
    .result { margin-top: 1rem; }
    mark { background: #fff3a0; padding: 0 2px; border-radius: 3px; }
    .langs { margin: 1rem 0; }
    .langs label { margin-right: 1.5rem; }
  </style>
</head>
<body>
  <div class="demo">
    <h2>Olfa message analyzer</h2>
    <p>Paste SMS, email, or WhatsApp text to check for scams.</p>

    <div class="card">
      <label class="langs">
        <input type="radio" name="lang" value="en" checked> English
      </label>
      <label class="langs">
        <input type="radio" name="lang" value="hi"> हिन्दी (Hindi)
      </label>
      <label class="langs">
        <input type="radio" name="lang" value="bn"> বাংলা (Bangla)
      </label>
    </div>

    <textarea id="msgInput" placeholder="Paste message text here…"></textarea>

    <div class="card">
      <div class="result">
        <strong>Highlighted spans:</strong>
        <div id="highlighted" style="white-space: pre-wrap; margin-top: 0.5rem;"></div>
      </div>
      <div id="status" style="margin-top: 0.5rem; color: #555; font-size: 0.9rem;"></div>
    </div>
  </div>

  <script type="module">
    import { analyze, highlighted } from './lib/rules.js';

    const msgInput = document.getElementById('msgInput');
    const highlightedDiv = document.getElementById('highlighted');
    const statusDiv = document.getElementById('status');

    function render(lang) {
      const text = msgInput.value.trim();
      if (!text) {
        highlightedDiv.textContent = '';
        statusDiv.textContent = '';
        return;
      }

      const matches = analyze(text, lang);
      const { highlighted: html } = highlighted(text, lang);

      if (matches.length === 0) {
        highlightedDiv.innerHTML = 'No scam signals detected.';
      } else {
        highlightedDiv.innerHTML = html;
      }

      statusDiv.textContent = `${matches.length} scam signal${matches.length !== 1 ? 's' : ''} found`;
    }

    // Live re‑render as user types
    msgInput.addEventListener('input', () => render(document.querySelector('input[name="lang"]:checked').value));
    // Initial render
    render('en');
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Olfa QR scanner demo</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #fafafa; color: #111; }
    .demo { max-width: 800px; margin: 2rem auto; padding: 1rem; }
    .card { border: 1px solid #ddd; border-radius: 8px; padding: 1rem; margin: 1rem 0; background: #fff; }
    canvas { border: 1px solid #aaa; display: block; margin: 0 auto; }
    button { padding: 0.5rem 1rem; font-size: 1rem; }
    #status { margin-top: 1rem; color: #555; }
    .qr-result { margin-top: 1rem; padding: 0.5rem; background: #e8f4fd; border-radius: 4px; display: none; }
    .qr-result.show { display: block; }
  </style>
</head>
<body>
  <div class="demo">
    <h2>Olfa QR scanner</h2>
    <p>Point your camera at a QR code, or upload an image to scan.</p>

    <div class="card">
      <label for="fileInput" style="display:block; margin-bottom:0.3rem;">Upload image</label>
      <input type="file" id="fileInput" accept="image/*">
      <canvas id="scanCanvas" width="300" height="300"></canvas>
    </div>

    <div id="status">Ready — upload an image or use the webcam.</div>
    <div class="qr-result" id="qrResult"></div>

    <hr>
    <p>This demo uses a <em>vendored</em> jsQR shim so it works offline.
    In a production build replace the shim with a real <code>import()</code>
    from <code>https://unpkg.com/jsqr@1.4.0/dist/jsQR.js</code>.</p>
  </div>

  <script>
    const fileInput = document.getElementById('fileInput');
    const canvas = document.getElementById('scanCanvas');
    const ctx = canvas.getContext('2d');
    const status = document.getElementById('status');
    const qrResult = document.getElementById('qrResult');

    // ---- handle file upload ----
    fileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      status.textContent = 'Reading image…';
      const img = new Image();
      img.onload = async () => {
        canvas.width = img.width;
        canvas.height = img.height;
        ctx.drawImage(img, 0, 0);

        // scan with our wrappped jsQR
        const pixelData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const result = await OlfaQR.scanImage(pixelData, canvas.width, canvas.height);

        if (result && result.data && result.data.text) {
          status.textContent = `QR code found: ${result.data.text}`;
          qrResult.classList.add('show');
          qrResult.textContent = `Decoded text: ${result.data.text}`;
        } else {
          status.textContent = 'No QR code found in the image.';
          qrResult.classList.remove('show');
        }
      };
      img.onerror = () => { status.textContent = 'Failed to load image.'; };
      img.src = URL.createObjectURL(file);
    });

    // ---- webcam fallback (very simple, just shows status) ----
    document.getElementById('useWebcam').addEventListener('click', async () => {
      status.textContent = 'Webcam not yet implemented in this shim demo.';
    });
  </script>
</body>
</html>
